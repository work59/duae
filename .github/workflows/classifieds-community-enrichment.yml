name: Classifieds Community Enrichment

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to enrich (YYYY-MM-DD). Leave empty for yesterday in Asia/Dubai."
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"  # 11:00 AM Asia/Dubai (after classifieds + community finish)

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          camoufox fetch

      - name: Prepare scrape jobs
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python r2_classifieds_community_enrichment.py prepare --date "${{ inputs.date }}" --out work
          else
            python r2_classifieds_community_enrichment.py prepare --out work
          fi

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("work/manifest.json").read_text(encoding="utf-8")
          )

          jobs = list(range(manifest["total_jobs"]))

          matrix = {"job": jobs}

          print("matrix:", json.dumps(matrix))
          print("has_jobs:", bool(jobs))

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"has_jobs={'true' if jobs else 'false'}\n")
          PY

      - name: Upload work manifest and jobs
        uses: actions/upload-artifact@v4
        with:
          name: cc-enrichment-work
          path: work/
          if-no-files-found: error
          retention-days: 2

  scrape:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_jobs == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Camoufox browser
        run: |
          python -m camoufox fetch

      - name: Download prepared jobs
        uses: actions/download-artifact@v4
        with:
          name: cc-enrichment-work
          path: work

      - name: Scrape job ${{ matrix.job }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p work/results
          python r2_classifieds_community_enrichment.py scrape \
            --job "work/jobs/job_$(printf '%05d' '${{ matrix.job }}').json" \
            --output "work/results/job_$(printf '%05d' '${{ matrix.job }}').json"

      - name: Upload scrape result
        uses: actions/upload-artifact@v4
        with:
          name: cc-enrichment-result-${{ matrix.job }}
          path: work/results/job_*.json
          if-no-files-found: error
          retention-days: 2

  combine:
    needs:
      - prepare
      - scrape
    if: ${{ always() && needs.prepare.result == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl boto3 python-dotenv

      - name: Download prepared work
        uses: actions/download-artifact@v4
        with:
          name: cc-enrichment-work
          path: work

      - name: Download scrape results
        uses: actions/download-artifact@v4
        with:
          pattern: cc-enrichment-result-*
          path: work/results
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Combine and upload enriched data
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python r2_classifieds_community_enrichment.py combine --date "${{ inputs.date }}" --work work
          else
            python r2_classifieds_community_enrichment.py combine --work work
          fi

      - name: Upload combine summary
        uses: actions/upload-artifact@v4
        with:
          name: cc-enrichment-summary
          path: work/combine_summary.json
          if-no-files-found: warn
          retention-days: 7